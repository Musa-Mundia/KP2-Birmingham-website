     section.featured-gallery {

    /* Gallery Grid */
    .gallery-row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
        margin: 20px 0;
    }

    /* Row and Column Styles */
    .row > .column {
      padding: 0 8px;
    }


    /* Create four equal columns that floats next to eachother */
    .column {
      float: left;
      padding: 0 8px;
      display: flex;
      flex-direction: column;
      max-inline-size: 100%;
    }

    /* The Modal (background) */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      padding-top: 50px;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: black;
    }

    /* Modal Content */
    .modal-content {
      position: relative;
      background-color: #000;
      margin: auto;
      padding: 0;
      width: 90%;
      max-width: 1200px;
    }

    /* The Close Button */
    .close {
      color: white;
      position: absolute;
      top: 10px;
      right: 25px;
      font-size: 35px;
      font-weight: bold;
      cursor: pointer;
      z-index: 1001;
    }

    .close:hover,
    .close:focus {
      color: #999;
      text-decoration: none;
      cursor: pointer;
    }

    /* Hide the slides by default */
    .mySlides {
      display: none;
    }

    /* Next & previous buttons */
    .prev,
    .next {
      cursor: pointer;
      position: absolute;
      top: 50%;
      width: auto;
      padding: 16px;
      margin-top: -50px;
      color: white;
      font-weight: bold;
      font-size: 20px;
      transition: 0.6s ease;
      border-radius: 0 3px 3px 0;
      background-color: rgba(0, 0, 0, 0.5);
      user-select: none;
      -webkit-user-select: none;
    }

    /* Position the "next button" to the right */
    .next {
      right: 0;
      border-radius: 3px 0 0 3px;
    }

    .prev {
      left: 0;
      border-radius: 0 3px 3px 0;
    }

    /* On hover, add a black background color with a little bit see-through */
    .prev:hover,
    .next:hover {
      background-color: rgba(0, 0, 0, 0.8);
    }

    /* Number text (1/3 etc) */
    .numbertext {
      color: #f2f2f2;
      font-size: 12px;
      padding: 8px 12px;
      position: absolute;
      top: 0;
    }

    .slide-counter {
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      position: absolute;
      top: 12px;
      right: 12px;
      background-color: rgba(0, 0, 0, 0.55);
      padding: 6px 10px;
      border-radius: 999px;
      z-index: 1002;
    }

    /* Caption text */
    .caption-container {
      text-align: center;
      background-color: black;
      padding: 2px 16px;
      color: white;
    }

    img.demo {
      opacity: 0.6;
      cursor: pointer;
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 8px;
      transition: 0.3s;
      flex-grow: 1;
    }

    .active,
    .demo:hover {
      opacity: 1;
    }

    img.hover-shadow {
      transition: 0.3s;
    }

    .hover-shadow:hover {
      box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);
    }

    /* Responsive columns for mobile */
    @media screen and (max-width: 1200px) {
      .gallery-row {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media screen and (max-width: 800px) {
      .column {
        width: 50%;
      }
      .gallery-row {
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
      }
      img.demo {
        height: 200px;
      }
    }

    @media screen and (max-width: 500px) {
      .column {
        width: 100%;
      }
      .gallery-row {
        grid-template-columns: 1fr;
        gap: 10px;
      }
      img.demo {
        height: 180px;
      }
    }

    .btn {
      background-color: rgb(115, 16, 118);
      border: none;
      color: white;
      padding: 12px 30px;
      cursor: pointer;
      font-size: 20px;
      font-weight: 500;
      padding: 10px 20px;
      letter-spacing: 0.5px;
      border-radius: 5000px;
      transition: all 0.3s;
      text-decoration: none;
    }

    .btn--download {
      padding: 16px 32px 15px 20px;
      font-size: 16px;
      position: fixed;
      bottom: 27px;
      left: calc(46%);
      z-index: 100;
      text-align: center;
      box-shadow: 0 6px 23px rgba(0,0,0,0.45);
      animation: fade-up 0.5s 0.4s backwards;
      text-decoration: none;
      display: inline-block;
    }

    .btn--download:hover {
      text-decoration: none;
      background-color: rgb(61, 37, 68);
    }

    @keyframes fade-up {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Darker background on mouse-over */
    .btn:hover {
      background-color: rgb(61, 37, 68);
    }

    .btn--back {
      color: white;
      text-decoration: none;
      font-size: 16px;
      padding: 8px 18px;

      margin-left: 20px;
      background: rgba(255,255,255,0.15);
      border-radius: 20px;
      transition: background 0.2s;
      align-self: center;
      white-space: nowrap;
      order: -1;
    }

    .btn--back:hover {
      background: rgba(255,255,255,0.25);
      color: white;
    }

  <span class="close cursor" onclick="closeModal()">&times;</span>

    <div id="slideCounter" class="slide-counter">1 / 1</div>

    <a class="prev" onclick="changeSlide(-1)">&#10094;</a>
    <a class="next" onclick="changeSlide(1)">&#10095;</a>
  </div>
</div>

<script>
// Open the Modal
function openModal() {
  document.getElementById("myModal").style.display = "block";
}

// Close the Modal
function closeModal() {
  document.getElementById("myModal").style.display = "none";
}

var slideIndex = 1;

// Next/previous controls
function changeSlide(n) {
  showSlides(slideIndex += n);
}

// Thumbnail image controls
function currentSlide(n) {
  showSlides(slideIndex = n);
}

function buildModalSlidesFromGallery() {
  var modalContent = document.querySelector('#myModal .modal-content');
  var thumbnails = document.querySelectorAll('.gallery-row .demo');
  var controls = modalContent.querySelectorAll('.prev, .next');

  modalContent.querySelectorAll('.mySlides').forEach(function(slide) {
    slide.remove();
  });

  thumbnails.forEach(function(thumb, index) {
    var slide = document.createElement('div');
    slide.className = 'mySlides';

    var numberText = document.createElement('div');
    numberText.className = 'numbertext';
    numberText.textContent = (index + 1) + ' / ' + thumbnails.length;

    var image = document.createElement('img');
    image.src = thumb.src;
    image.style.width = '100%';

    slide.appendChild(numberText);
    slide.appendChild(image);
    modalContent.insertBefore(slide, controls[0]);
  });
}

function showSlides(n) {
  var i;
  var slides = document.getElementsByClassName("mySlides");
  var dots = document.getElementsByClassName("demo");
  var captionText = document.getElementById("caption");
  var slideCounter = document.getElementById("slideCounter");
  if (slides.length === 0 || dots.length === 0) { return; }
  if (n > slides.length) {slideIndex = 1}
  if (n < 1) {slideIndex = slides.length}
  for (i = 0; i < slides.length; i++) {
    slides[i].style.display = "none";
  }
  for (i = 0; i < dots.length; i++) {
    dots[i].className = dots[i].className.replace(" active", "");
  }
  slides[slideIndex-1].style.display = "block";
  dots[slideIndex-1].className += " active";
  if (captionText) {
    captionText.innerHTML = dots[slideIndex-1].alt;
  }
  if (slideCounter) {
    slideCounter.textContent = slideIndex + " / " + slides.length;
  }
}

// Initialize slides on page load
buildModalSlidesFromGallery();
showSlides(slideIndex);

// Close modal when clicking outside of it
window.onclick = function(event) {
    let modal = document.getElementById("myModal");
    if (event.target == modal) {
        modal.style.display = "none";
    }
}

// Close modal with Escape key
document.addEventListener('keydown', function(e) {
    if (e.key === "Escape") {
        closeModal();
    }
});

// Navigate with arrow keys
document.addEventListener('keydown', function(e) {
    let modal = document.getElementById("myModal");
    if (modal.style.display === "block") {
        if (e.key === "ArrowLeft") {
            changeSlide(-1);
        } else if (e.key === "ArrowRight") {
            changeSlide(1);
        }
    }
});

// Download all images as ZIP
async function downloadAllImagesAsZip() {
  const zip = new JSZip();
  const images = document.querySelectorAll('.gallery-row .demo');
  
  for (let i = 0; i < images.length; i++) {
    const img = images[i];
    try {
      const response = await fetch(img.src);
      const blob = await response.blob();
      zip.file(`kharis-church-photo-${i + 1}.jpg`, blob);
    } catch (error) {
      console.error(`Failed to fetch image ${i + 1}:`, error);
    }
  }
  
  const content = await zip.generateAsync({type: 'blob'});
  saveAs(content, 'kharis-church-photos.zip');
}
</script>
